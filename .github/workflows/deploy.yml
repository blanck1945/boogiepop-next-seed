name: Build & Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION:     us-east-1
  ECR_REGISTRY:   653876198281.dkr.ecr.us-east-1.amazonaws.com
  ECR_REPOSITORY: boogiepop-next-seed
  ECS_CLUSTER:    boogiepop-api-cluster
  ECS_SERVICE:    boogiepop-api-fe-next-seed-svc

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: boogiepop-next-seed

      # Checkout local deps so file: paths resolve inside Docker context
      - uses: actions/checkout@v4
        with:
          repository: blanck1945/boogiepop-auth-sdk
          path: boogiepop-auth-sdk

      - uses: actions/checkout@v4
        with:
          repository: blanck1945/boogiepop-ui
          path: boogiepop-ui

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::653876198281:role/boogiepop-api-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx (ARM64)
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: boogiepop-next-seed/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster $ECS_CLUSTER \
            --service $ECS_SERVICE \
            --force-new-deployment \
            --region $AWS_REGION
